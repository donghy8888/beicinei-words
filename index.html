  background:radial-gradient(circle at 36% 30%,var(--card) 0 52%,var(--bad-soft) 100%);border:6px solid var(--ok);box-shadow:inset 0 0 0 4px var(--ok-soft),0 6px 14px rgba(0,0,0,.12)}

<script>const DATA={"sections":[{"id":"U1-V","unit":"8AU1","section":"Viewing","pages":"P4-5","title":"💧 Viewing & Listening","name":"8AU1 Viewing P4-5"},{"id":"U1-S","unit":"8AU1","section":"Speaking","pages":"P6-7","title":"🗣️ Speaking","name":"8AU1 Speaking P6-7"},{"id":"U1-R","unit":"8AU1","section":"Reading","pages":"P8-11","title":"🏜️ Reading","name":"8AU1 Reading P8-11"},{"id":"U2-W","unit":"8AU2","section":"Writing","pages":"P14-15","title":"✍️ Writing","name":"8AU2 Writing P14-15"},{"id":"U2-S","unit":"8AU2","section":"Speaking","pages":"P22-23","title":"📞 Speaking","name":"8AU2 Speaking P22-23"},{"id":"U2-R","unit":"8AU2","section":"Reading","pages":"P24-27","title":"🤖 Reading","name":"8AU2 Reading P24-27"}],"tips":[{"section":"U1-V","text":"关注听力材料中的数字\n要识别听力材料中与数字相关的内容，应当对一些特别的数字读法有所了解。\n（1）小数\n小数点通常读作“point”，小数点后的数字逐个读出。如：\n0.5: zero point five 2.75: two point seven five\n10.01: ten point zero one 3.14159: three point one four one five nine\n小数点后只有一个零时，也可以读作“o”。如：\n1.05: one point o five\n（2）分数\n分数由分子和分母组成。分子读作基数词，分母读作序数词。当分子大于1时，分母用复数形式。如：\n: one third : two thirds : five eighths\n\n以下是一些特殊的分数读法。\n: a half : a quarter : three quarters\n\n带分数要将整数部分和分数部分分开读。如：\n:twoandahalf : three and three quarters\n\n（3）百分数\n百分数中的“％”读作“per cent”，表示“百分之······”，无复数形式。如：\n50%: fifty per cent 25%: twenty-five per cent\n100%: one hundred per cent 12.5%: twelve point five per cent"},{"section":"U1-R","text":"构词法-转化法\n转化法是一种构词法，即一个词从一种词性转换为另一种词性并产生新的词义，而其形式保持不变。在英语中，最常见的转化法是名词和形容词转化为动词。\n（1）名词转化为动词\n\n（2）形容词转化为动词"},{"section":"U2-W","text":"如何撰写观点类文章\n(1)结构逻辑清晰。 文章需按照引言、主体、结尾的结构展开，逻辑清晰，层次分明。\n(2)明确表达观点。引言部分需直接表达观点，使读者迅速了解文章的 立场。如在课本Writing 板块的范文中，作者在引言部分直接表达了自己的 观点，即：数字生活虽然方便、有趣，但我们应该意识到它的缺点。\n(3 )说明理由，提供解释或例子。文章主体部分需通过具体的理由来支撑 观点。每个理由都应有详细的解释或具体的例子，以使文章更具说服力和可读性。\n如范文所示：理由1——数字生活导致过多的屏幕时间。(解释/例子——有 些人花费太多时间玩电脑游戏、观看视频或在线聊天，从而减少了进行健康户 外活动的时间);\n理由2——数字生活并不总是安全的。(解释/例子——当我们 访问某些网站时，其中隐藏的软件或病毒可能会收集我们的个人信息。)\n(4 )重述观点。 结尾部分需重述观点，强调文章的核心信息，以给读者留下 深刻印象。在范文中，作者在结尾部分重述了自己的观点，强调虽然数字技术给 我们的生活带来了许多好处，但也带来了问题，因此我们必须学会合理地使用它。"},{"section":"U2-S","text":"常用的投诉用语\nI would like to / I'd like to complain about...             我想投诉 … …\nI am calling about a problem I've met/ I’ve run into. 我打电话来是因为我遇到的一个问题。\nCould I speak to the manager? I'd like to make a complaint. 可以帮我找一下经理吗?我要投诉。\nExcuse me, but I'm not happy with ...                        抱歉，我对……不满意。\nI'm experiencing difficulties with the ... I   bought. Can you…? 我买的 … 有点问题。你能…吗?\nI’m sorry to have to say this, but I…                          我很抱歉这么说，但是我 ……"},{"section":"U2-R","text":"令人惊叹的数字技术\n数字技术使残障群体的生活便利了许多。例如， 一款为盲人设计的新型 智能手杖可以检测到任何使用者靠近的物体，警告使用者可能存在的危险。它还可以指路，并告知使用者公共汽车和火车的时刻表。人们相信这种技术 将使盲人的生活更安全、更便捷。\n数字技术使知识共享变得更加容易。它给予学生同等的学习机会，无论他们身处何地。根据2022年的一份报告，超过22%的印度人口不会读写。为了改变这种状况，印度为农村地区的学校提供了强大的互联网连接。那里的许多学生直到该项目启动才有机会学习。他们现在可以共享新徳里一所 顶级学校的精彩在线课程。\n消防机器人正在拯救生命。它们能走、能跑、能爬，还能和被困火场的人员进行交流。当机器人四处移动时，它们会向控制单元发送视频信息。通过这种方式，消防员可以清楚地看到火灾环境，然后制定稳妥的(救援)计划。在危险的情况下，机器人真的可以提供很大的帮助。"}],"words":[{"id":"U1-V-01","unit":"8AU1","section":"U1-V","sub":"","group":"","no":"1.","optional":false,"type":"word","cn":"升","pos":"n.","en":"litre","phonetic":"","opp":"","oppCn":"","pl":"","forms":{},"alt":[],"notes":[]},{"id":"U1-V-02","unit":"8AU1","section":"U1-V","sub":"","group":"","no":"1.","optional":true,"type":"word","cn":"毫升","pos":"n.","en":"millilitre","phonetic":"","opp":"","oppCn":"","pl":"","forms":{},"alt":[],"notes":[]},{"id":"U1-V-03","unit":"8AU1","section":"U1-V","sub":"","group":"","no":"2.","optional":false,"type":"word","cn":"工厂","pos":"n.","en":"factory","phonetic":"","opp":"","oppCn":"","pl":"factories","forms":{},"alt":[],"notes":[]},{"id":"U1-V-04","unit":"8AU1","section":"U1-V","sub":"","group":"","no":"3.","optional":false,"type":"word","cn":"十亿","pos":"n.","en":"billion","phonetic":"","opp":"","oppCn":"","pl":"","forms":{},"alt":[],"notes":[]},{"id":"U1-V-05","unit":"8AU1","section":"U1-V","sub":"","group":"","no":"3.","optional":false,"type":"word","cn":"百万","pos":"n.","en":"million","phonet     const oldTips = S.custom.tips.filter(t => t.section === id).map(t => t.text);
    const tipTexts = mode === 'merge' ? [...new Set(oldTips.concat(it.tips || []))] : (it.tips || []);
    S.custom.tips = S.custom.tips.filter(t => t.section !== id).concat(tipTexts.map(text => ({ section: id, text })));
