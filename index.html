<script>const DATA={"sections":[{"id":"U1-V","unit":"8AU1","section":"Viewing","pages":"P4-5","title":"💧 Viewing & Listening","name":"8AU1 Viewing P4-5"},{"id":"U1-S","unit":"8AU1","section":"Speaking","pages":"P6-7","title":"🗣️ Speaking","name":"8AU1 Speaking P6-7"},{"id":"U1-R","unit":"8AU1","section":"Reading","pages":"P8-11","title":"🏜️ Reading","name":"8AU1 Reading P8-11"},{"id":"U2-W","unit":"8AU2","section":"Writing","pages":"P14-15","title":"✍️ Writing","name":"8AU2 Writing P14-15"},{"id":"U2-S","unit":"8AU2","section":"Speaking","pages":"P22-23","title":"📞 Speaking","name":"8AU2 Speaking P22-23"},{"id":"U2-R","unit":"8AU2","section":"Reading","pages":"P24-27","title":"🤖 Reading","name":"8AU2 Reading P24-27"}],"tips":[{"section":"U1-V","text":"关注听力材料中的数字\n要识别听力材料中与数字相关的内容，应当对一些特别的数字读法有所了解。\n（1）小数\n小数点通常读作“point”，小数点后的数字逐个读出。如：\n0.5: zero point five 2.75: two point seven five\n10.01: ten point zero one 3.14159: three point one four one five nine\n小数点后只有一个零时，也可以读作“o”。如：\n1.05: one point o five\n（2）分数\n分数由分子和分母组成。分子读作基数词，分母读作序数词。当分子大于1时，分母用复数形式。如：\n: one third : two thirds : five eighths\n\n以下是一些特殊的分数读法。\n: a half : a quarter : three quarters\n\n带分数要将整数部分和分数部分分开读。如：\n:twoandahalf : three and three quarters\n\n（3）百分数\n百分数中的“％”读作“per cent”，表示“百分之······”，无复数形式。如：\n50%: fifty per cent 25%: twenty-five per cent\n100%: one hundred per cent 12.5%: twelve point five per cent"},{"section":"U1-R","text":"构词法-转化法\n转化法是一种构词法，即一个词从一种词性转换为另一种词性并产生新的词义，而其形式保持不变。在英语中，最常见的转化法是名词和形容词转化为动词。\n（1）名词转化为动词\n\n（2）形容词转化为动词"},{"section":"U2-W","text":"如何撰写观点类文章\n(1)结构逻辑清晰。 文章需按照引言、主体、结尾的结构展开，逻辑清晰，层次分明。\n(2)明确表达观点。引言部分需直接表达观点，使读者迅速了解文章的 立场。如在课本Writing 板块的范文中，作者在引言部分直接表达了自己的 观点，即：数字生活虽然方便、有趣，但我们应该意识到它的缺点。\n(3 )说明理由，提供解释或例子。文章主体部分需通过具体的理由来支撑 观点。每个理由都应有详细的解释或具体的例子，以使文章更具说服力和可读性。\n如范文所示：理由1——数字生活导致过多的屏幕时间。(解释/例子——有 些人花费太多时间玩电脑游戏、观看视频或在线聊天，从而减少了进行健康户 外活动的时间);\n理由2——数字生活并不总是安全的。(解释/例子——当我们 访问某些网站时，其中隐藏的软件或病毒可能会收集我们的个人信息。)\n(4 )重述观点。 结尾部分需重述观点，强调文章的核心信息，以给读者留下 深刻印象。在范文中，作者在结尾部分重述了自己的观点，强调虽然数字技术给 我们的生活带来了许多好处，但也带来了问题，因此我们必须学会合理地使用它。"},{"section":"U2-S","text":"常用的投诉用语\nI would like to / I'd like to complain about...             我想投诉 … …\nI am calling about a problem I've met/ I’ve run into. 我打电话来是因为我遇到的一个问题。\nCould I speak to the manager? I'd like to make a complaint. 可以帮我找一下经理吗?我要投诉。\nExcuse me, but I'm not happy with ...                        抱歉，我对……不满意。\nI'm experiencing difficulties with the ... I   bought. Can you…? 我买的 … 有点问题。你能…吗?\nI’m sorry to have to say this, but I…                          我很抱歉这么说，但是我 ……"},{"section":"U2-R","text":"令人惊叹的数字技术\n数字技术使残障群体的生活便利了许多。例如， 一款为盲人设计的新型 智能手杖可以检测到任何使用者靠近的物体，警告使用者可能存在的危险。它还可以指路，并告知使用者公共汽车和火车的时刻表。人们相信这种技术 将使盲人的生活更安全、更便捷。\n数字技术使知识共享变得更加容易。它给予学生同等的学习机会，无论他们身处何地。根据2022年的一份报告，超过22%的印度人口不会读写。为了改变这种状况，印度为农村地区的学校提供了强大的互联网连接。那里的许多学生直到该项目启动才有机会学习。他们现在可以共享新徳里一所 顶级学校的精彩在线课程。\n消防机器人正在拯救生命。它们能走、能跑、能爬，还能和被困火场的人员进行交流。当机器人四处移动时，它们会向控制单元发送视频信息。通过这种方式，消防员可以清楚地看到火灾环境，然后制定稳妥的(救援)计划。在危险的情况下，机器人真的可以提供很大的帮助。"}],"words":[{"id":"U1-V-01","unit":"8AU1","section":"U1-V","sub":"","group":"","no":"1.","optional":false,"type":"word","cn":"升","pos":"n.","en":"litre","phonetic":"","opp":"","oppCn":"","pl":"","forms":{},"alt":[],"notes":[]},{"id":"U1-V-02","unit":"8AU1","section":"U1-V","sub":"","group":"","no":"1.","optional":true,"type":"word","cn":"毫升","pos":"n.","en":"millilitre","phonetic":"","opp":"","oppCn":"","pl":"","forms":{},"alt":[],"notes":[]},{"id":"U1-V-03","unit":"8AU1","section":"U1-V","sub":"","group":"","no":"2.","optional":false,"type":"word","cn":"工厂","pos":"n.","en":"factory","phonetic":"","opp":"","oppCn":"","pl":"factories","forms":{},"alt":[],"notes":[]},{"id":"U1-V-04","unit":"8AU1","section":"U1-V","sub":"","group":"","no":"3.","optional":false,"type":"word","cn":"十亿","pos":"n.","en":"billion","phonetic":"","opp":"","oppCn":"","pl":"","forms":{},"alt":[],"notes":[]},{"id":"U1-V-05","unit":"8AU1","section":"U1-V","sub":"","group":"","no":"3.","optional":false,"type":"word","cn":"百万","pos":"n.","en":"million","phonet /* ================= import / export ================= */

function importText(txt) {

/* ================= custom word files (import / delete) ================= */
const normName = n => String(n || '').toLowerCase().replace(/\s+/g, ' ').trim();
const secIdFor = name => 'C-' + hash('sec|' + normName(name)).toString(36);
const builtinConflict = name => DATA.sections.find(x => normName(x.name) === normName(name)) || null;
const customSec = id => S.custom.sections.find(x => x.id === id) || null;
const WFIELDS = ['no', 'optional', 'type', 'cn', 'pos', 'en', 'phonetic', 'opp', 'oppCn', 'pl', 'forms', 'alt', 'notes', 'sub', 'group'];
let PREVIEW = null;
function importItems(items) {
  const snapshot = JSON.stringify(S.custom), now = clock(), res = [];
  for (const it of items) {
    if (!it || it.error || it.include === false || !it.words || !it.words.length) continue;
    let name = Importer.clean(it.name) || '自定义单词';
    if (builtinConflict(name)) { res.push({ name, status: 'skip', msg: '与内置关卡同名' }); continue; }
    let id = secIdFor(name), exists = customSec(id);
    const mode = exists ? (it.mode || 'replace') : 'new';
    if (exists && mode === 'new') { let k = 2; while (customSec(secIdFor(`${name} (${k})`)) || builtinConflict(`${name} (${k})`)) k++; name = `${name} (${k})`; id = secIdFor(name); exists = null; }
    let meta = { unit: it.unit || '', section: it.section || name, pages: it.pages || '' };
    if (normName(name) !== normName(it.origName || it.name)) { const t = Importer.parseTitle(name, name); meta = { unit: t.unit, section: t.unit || t.pages ? t.section : name, pages: t.pages }; }
    const used = new Set();
    const fresh = it.words.map(w => {
      const e = {}; WFIELDS.forEach(k => e[k] = w[k] === undefined ? (k === 'forms' ? {} : k === 'alt' || k === 'notes' ? [] : k === 'optional' ? false : '') : w[k]);
      let base = id + '-' + hash(String(e.en).toLowerCase() + '|' + e.cn).toString(36), wid = base, k = 2;
      while (used.has(wid)) wid = base + '-' + (k++);
      used.add(wid); e.id = wid; e.section = id; e.unit = meta.unit; return e;
    });
    const old = S.custom.words.filter(w => w.section === id);
    let words = fresh;
    if (exists && mode === 'merge') { const oldIds = new Set(old.map(w => w.id)); words = old.concat(fresh.filter(w => !oldIds.has(w.id))); }
    if (exists && mode === 'replace') { const keep = new Set(words.map(w => w.id)); old.forEach(w => { if (!keep.has(w.id)) delete S.words[w.id]; }); }
    S.custom.words = S.custom.words.filter(w => w.section !== id).concat(words);
    const oldTips = S.custom.tips.filter(t => t.section === id).map(t => t.text);
    const tipTexts = mode === 'merge' ? [...new Set(oldTips.concat(it.tips || []))] : (it.tips || []);
    S.custom.tips = S.custom.tips.filter(t => t.section !== id).concat(tipTexts.map(text => ({ section: id, text })));
    const sec = Object.assign(exists || {}, { id, unit: meta.unit, section: meta.section, pages: meta.pages, title: name, name, custom: true, source: it.fileName || '', imported: now });
    if (!exists) S.custom.sections.push(sec);
    res.push({ name, id, status: exists ? mode : 'new', total: words.length, added: exists ? words.filter(w => !old.some(o => o.id === w.id)).length : words.length, kept: words.filter(w => S.words[w.id]).length });
  }
  rebuildData(S.custom);
  if (!save()) { S.custom = JSON.parse(snapshot); rebuildData(S.custom); save(); throw new Error('浏览器存储空间不足，导入已撤销'); }
  return res;
}
function deleteSection(id) {
  const sec = customSec(id); if (!sec) return false;
  S.custom.words.filter(w => w.section === id).forEach(w => delete S.words[w.id]);
  S.custom.sections = S.custom.sections.filter(x => x.id !== id);
  S.custom.words = S.custom.words.filter(w => w.section !== id);
  S.custom.tips = S.custom.tips.filter(t => t.section !== id);
  if (S.pick) { S.pick.secs = S.pick.secs.filter(x => x !== id); if (!S.pick.secs.length) S.pick = null; }
  if (S.lastPick) { S.lastPick = S.lastPick.filter(x => x !== id); if (!S.lastPick.length) S.lastPick = null; }
  rebuildData(S.custom); migrate(S); save(); return true;
}
async function handleWordFiles(files, opts) {
  files = Array.from(files || []); if (!files.length) return;
  try { toast(`📖 正在读取 ${files.length} 个文件…`); } catch (e) { }
  const out = [];
  for (const f of files) {
    try {
      const items = await Importer.parseFile(f, opts);
      items.forEach(it => {
        const p = Object.assign({}, it, { origName: it.name, include: true, mode: 'replace', note: '' });
        if (builtinConflict(p.name)) {
          const fn = Importer.parseTitle((f.name || '').replace(/\.[a-z]+$/i, ''), '');
          const alt = fn.unit && !builtinConflict(fn.name) ? fn.name : p.name + ' 副本';
          p.note = `文件标题「${p.name}」和内置关卡重名，已改为「${alt}」，可再修改`; p.name = alt;
        }
        if (!p.words.length) { p.error = '没有找到任何单词（请检查表格格式）'; }
        out.push(p);
      });
    } catch (e) { out.push({ fileName: f.name, error: e && e.message ? e.message : String(e) }); }
  }
  PREVIEW = out; renderImportPreview(); return out;
}

function storageCheck() {

    else if (framed) reason = '页面是在预览/嵌入窗口里打开的，关闭后进度可能丢失。';
    else if (/; wv\)|MicroMessenger|QQ\/|Lark|Feishu|DingTalk|FBA[NV]|Instagram|Line\//i.test(ua)) reason = '在 App 内置浏览器里打开，进度可能会被清除。';

}

  pickadd: d => { const cur = pickedToday() ? todayPick() : []; if (!cur.includes(d.sec)) cur.push(d.sec); setPick(cur); toast('已加入今天的学习计划 📌'); renderLevel(d.sec); },
  optTog: (d, el) => { S.settings.optional = el.checked; save(); },
  asTog: (d, el) => { S.settings.autoSpeak = el.checked; save(); },
  pen: () => { }, rate: () => { },
  testvoice: () => speak('Hello! Water is precious. Let us save water.'),
  export: () => { $('#io').value = exportText(); $('#io').select(); toast('进度代码已生成，复制保存好～'); },
  copy: () => {
    const ta = $('#io'); if (!ta.value) ta.value = exportText();
    const done = () => toast('已复制 📋');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('请手动长按复制'); } });
    else { ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('请手动长按复制'); } }
  },
  download: () => {
    try { const b = new Blob([exportText()], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = '背单词进度-' + dayKey(clock()) + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 100); } catch (e) { toast('下载失败，请用复制'); }
  },
  import: () => {
    const v = $('#io').value.trim(); if (!v) { toast('请先粘贴进度代码'); return; }
    if (!confirm('导入会覆盖当前设备上的进度，确定吗？')) return;
    try { importText(v); toast('导入成功 🎉'); renderHome(); } catch (e) { alert('导入失败：' + e.message); }
  },
  reset: () => {
    if (!confirm('确定要重置全部进度吗？所有单词进度、金币、XP 和打卡记录都会清空！（导入的关卡会保留）')) return;
    if (!confirm('真的确定吗？此操作无法撤销（建议先导出备份）。')) return;
    const keep = S.custom; S = defaultState(); S.custom = keep; rebuildData(S.custom); save(); toast('已重置（导入的关卡保留）'); renderHome();
  }
};
document.addEventListener('click', e => {
  requestPersist();
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.tagName === 'SELECT') return;
  const f = ACT[b.dataset.act]; if (f) f(b.dataset, b);
});
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !SES) renderHome(); });

  Importer, rebuildData, importItems, deleteSection, handleWordFiles, get PREVIEW() { return PREVIEW; }, exportText, importText, storageCheck, secIdFor, BUILTIN_IDS,
  dueList, newList, newLeftToday, todayPick, setPick, pickedToday, nextUnfinished, migrate, streak, levelInfo, checkSpell, variants, distractors, bonusList, bonusFakes, buildQ, chooseType, startSession, submit, nextCard, ACT, today, hintText, renderHome };
